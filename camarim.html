  <!-- ============================================================
       O CAMARIM
       Uma faixa só, com o mesmo slider das montagens do Ato II.

       Eram sete blocos, um por ensaio. Mas nenhuma destas fotos tem
       ficha — sem fotógrafo e sem ano, quatro dos sete rótulos só
       repetiam a palavra "Ensaio". Separar sem ter o que dizer em cada
       parte é sumário de um texto que não existe.

       A ordem é editorial: a camisa oliva abre, as duas do Mickey fecham.
       As do Mickey chamavam book-03 e book-04, do mesmo dia que as duas
       que ficaram no meio — como elas foram para o fim de propósito, o
       nome passou a ser mickey-01 e 02, para ninguém mais tarde achar
       que a numeração se perdeu.

       Sem legenda nos painéis: não há ano, papel nem crédito para pôr
       ali, e caixa vazia é pior que caixa nenhuma.
       ============================================================ -->
