  <!-- ============================================================
       ABERTURA DO ATO

       PLACEHOLDER: a fotografia é assets/img/abertura-ao-vivo.jpg.
       Para trocar, basta substituir o arquivo nesse caminho. Se a
       nova foto tiver outra proporção, ajuste --foto-forma abaixo
       (é a largura / altura da imagem), senão o quadro corta.
       ============================================================ -->
  <section class="abertura" style="--foto-borda: 44%; --foto-pos: 50% 34%; --foto-fade: 24%; --foto-brilho: 1">

    <figure class="abertura__figura" aria-hidden="true">
      <img class="abertura__foto" src="assets/img/abertura-ao-vivo.jpg" alt="" width="1600" height="1186" decoding="async">
      <span class="abertura__veu"></span>
    </figure>

    <h1 class="abertura__titulo">Ao vivo</h1>
    <p class="abertura__frase">“É onde consigo expressar minha energia.”</p>

    <span class="grain" aria-hidden="true"></span>
  </section>


  <!-- ============================================================
       O SHOWREEL
       Um minuto e meio de palco. Entra mudo, como fotografia que se
       mexe; ganha som e controles nativos quando alguem clica.
       ============================================================ -->
  <section class="showreel" aria-label="Showreel">

    <figure class="showreel__quadro" data-showreel data-reveal>
      <video class="showreel__video"
             poster="assets/img/showreel-poster.jpg"
             preload="metadata"
             muted loop playsinline
             width="1920" height="1080"
             aria-label="Bruna Pazinato ao vivo: cortes de shows e apresentações">
        <source src="assets/video/showreel.mp4" type="video/mp4">
      </video>

      <button class="showreel__som" type="button">
        <span class="showreel__triangulo" aria-hidden="true"></span>
        <span>Com som</span>
      </button>
    </figure>

  </section>
