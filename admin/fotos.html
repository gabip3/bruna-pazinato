<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Minhas fotos | Bruna Pazinato</title>
<meta name="theme-color" content="#0B0B0C">
<meta name="color-scheme" content="dark">

<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@300..600&family=Young+Serif&display=swap">
<link rel="stylesheet" href="painel.css?v=202610061900">
</head>
<body>

<div class="tela" id="tela-espera"><p class="espera">um instante…</p></div>

<div class="tela" id="tela-fora" hidden>
  <p class="espera">Entra no painel para ver suas fotos. <a href="./">Ir para a entrada</a></p>
</div>

<div class="tela" id="tela-fotos" hidden>
  <header class="topo">
    <a class="topo__voltar" href="./">Voltar</a>
    <p class="topo__marca">Bruna <b>Pazin<i>ato</i></b></p>
    <button class="sair" type="button" id="botao-sair">Sair</button>
  </header>

  <!-- escolher a montagem -->
  <main class="casa" id="passo-escolher">
    <h1 class="casa__ola">Minhas fotos</h1>
    <p class="casa__pergunta">De qual espetáculo?</p>
    <div class="montagens" id="lista-montagens"></div>
  </main>

  <!-- as fotos de uma montagem -->
  <main class="casa" id="passo-fotos" hidden>
    <button class="voltinha" type="button" id="botao-outra">← escolher outro espetáculo</button>
    <h1 class="casa__ola" id="fotos-titulo"></h1>
    <p class="casa__pergunta" id="fotos-conta"></p>

    <label class="soltar" id="area-soltar">
      <input type="file" id="arquivo" accept="image/*,.heic,.heif" multiple hidden>
      <span class="soltar__nome">Acrescentar foto</span>
      <span class="soltar__nota">arraste aqui, ou toque para escolher do seu celular</span>
    </label>

    <!-- os textos deste espetáculo -->
    <details class="textos" id="textos">
      <summary class="textos__abrir">Mudar os textos deste espetáculo</summary>
      <div class="textos__corpo">
        <label class="campo">
          <span class="campo__rotulo">Nome do espetáculo</span>
          <input class="campo__valor" type="text" id="txt-titulo" autocomplete="off">
        </label>
        <label class="campo">
          <span class="campo__rotulo">Subtítulo</span>
          <input class="campo__valor" type="text" id="txt-sub" autocomplete="off">
        </label>
        <label class="campo">
          <span class="campo__rotulo">Personagem</span>
          <input class="campo__valor" type="text" id="txt-papel" autocomplete="off" placeholder="quem ela interpreta">
        </label>
        <label class="campo">
          <span class="campo__rotulo">Ano</span>
          <input class="campo__valor" type="text" id="txt-ano" autocomplete="off">
        </label>
        <label class="campo">
          <span class="campo__rotulo">Fotos de</span>
          <input class="campo__valor" type="text" id="txt-credito" autocomplete="off">
        </label>
        <button class="botao" type="button" id="botao-textos" disabled>Enviar as mudanças</button>
      </div>
    </details>

    <p class="ordem" id="ordem" hidden>
      <span class="ordem__nota">Você mudou a ordem das fotos.</span>
      <button class="botao" type="button" id="botao-ordem">Enviar a nova ordem</button>
      <button class="botao botao--fraco" type="button" id="botao-desfazer">Desfazer</button>
    </p>

    <p class="aviso" id="aviso" role="status" aria-live="polite" hidden></p>

    <div class="grade" id="grade-fotos"></div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="config.js?v=202610062000"></script>
<script src="enviar.js?v=202610061700"></script>
<script src="fotos.js?v=202610062030"></script>
</body>
</html>
