<main id="conteudo">

  <!-- ============================================================
       CONTATO

       Eram três blocos, um por assunto. Como o endereço é um só, três
       portas para a mesma sala viraram repetição: agora é um texto
       curto que diz o que cabe, e um único convite.

       A abertura não tem botão: o formulário vem logo abaixo, e um
       "escrever" aqui só rolaria dois dedos de página.
       ============================================================ -->
  <section class="contato">

    <div class="contato__texto">
      <h1 class="contato__titulo" data-reveal>Vamos conversar.</h1>
      <p class="contato__linha" data-reveal style="--i:1">Shows · Projetos · Imprensa</p>

    </div>

    <figure class="contato__retrato" data-reveal style="--i:1">
      <img src="assets/img/contato-retrato.jpg" alt="Bruna Pazinato estendendo o microfone" width="1200" height="1500" decoding="async">
    </figure>

  </section>

  <!-- ============================================================
       O RECADO

       Formulário sem caixa: cada campo é uma linha com um fio
       embaixo, que vira coral quando está em uso. Nada de moldura
       cinza com canto arredondado.

       A access key do Web3Forms fica no HTML de propósito: é chave
       pública, e é assim que o serviço funciona — quem protege é o
       domínio e o filtro de spam deles, não o segredo da chave.
       O campo escondido "botcheck" é a armadilha de robô que eles
       pedem, e o "subject" é o assunto que chega na caixa dela.
       ============================================================ -->
  <section class="recado" id="escrever" aria-label="Formulário de contato">

    <form class="recado__form" action="https://api.web3forms.com/submit" method="POST" data-reveal style="--i:1">

      <input type="hidden" name="access_key" value="81a70efb-5e14-47e2-a2f0-8201e1c519f1">
      <input type="hidden" name="subject" value="Contato pelo site">
      <input type="checkbox" name="botcheck" class="recado__isca" tabindex="-1" autocomplete="off">

      <p class="campo">
        <label class="campo__rotulo" for="campo-nome">Nome</label>
        <input class="campo__valor" id="campo-nome" type="text" name="name" autocomplete="name" required>
      </p>

      <p class="campo">
        <label class="campo__rotulo" for="campo-email">E-mail</label>
        <input class="campo__valor" id="campo-email" type="email" name="email" autocomplete="email" required>
      </p>

      <p class="campo campo--largo">
        <label class="campo__rotulo" for="campo-recado">Mensagem</label>
        <textarea class="campo__valor campo__valor--area" id="campo-recado" name="message" rows="4" required></textarea>
      </p>

      <button class="recado__enviar" type="submit">
        <span>Enviar</span>
        <span class="recado__seta" aria-hidden="true">&#8594;</span>
      </button>

    </form>

    <p class="recado__pe" data-reveal style="--i:2">
      <a href="mailto:contato.brunapazinato@gmail.com">contato.brunapazinato@gmail.com</a>
      <span class="recado__registro">DRT 0037897 SSP · OMB 68682</span>
    </p>

  </section>
</main>
