<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Sem foto de cena">
  <defs>
    <linearGradient id="f" x1="0.2" y1="0" x2="0.75" y2="1">
      <stop offset="0"    stop-color="#2A262C"/>
      <stop offset="0.5"  stop-color="#191619"/>
      <stop offset="1"    stop-color="#0D0D10"/>
    </linearGradient>
    <linearGradient id="luz" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0"   stop-color="#E3B879" stop-opacity="0.26"/>
      <stop offset="0.7" stop-color="#E3B879" stop-opacity="0.04"/>
      <stop offset="1"   stop-color="#E3B879" stop-opacity="0"/>
    </linearGradient>
    <filter id="b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="52"/>
    </filter>
    <filter id="gr" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1200" height="1600" fill="url(#f)"/>
  <polygon points="500,-60 720,-60 1010,1600 190,1600" fill="url(#luz)" filter="url(#b)"/>
  <rect width="1200" height="1600" filter="url(#gr)" opacity="0.12"/>

  <rect x="76" y="1418" width="44" height="1" fill="#D14B32" opacity="0.9"/>
  <g fill="#F0EBE4" font-family="Helvetica, Arial, sans-serif">
    <text x="76" y="1476" font-size="20" letter-spacing="7" opacity="0.46">FALTA FOTO DESTE ESPETÁCULO</text>
  </g>
</svg>
